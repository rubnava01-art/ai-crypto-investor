# Render Blueprint — AI Crypto Investor (free tier)
# Deploy: connect this repo in Render, it provisions API + web + Postgres.

databases:
  - name: crypto-investor-db
    plan: free

services:
  # FastAPI backend (Docker). Runs Alembic migrations on boot.
  - type: web
    name: crypto-investor-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crypto-investor-db
          property: connectionString
      - key: AI_PROVIDER
        value: stub
      - key: PYTHONUNBUFFERED
        value: "1"

  # Next.js frontend (Docker). Needs the API URL at build time.
  - type: web
    name: crypto-investor-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    dockerfileArgs:
      NEXT_PUBLIC_API_URL: https://crypto-investor-api.onrender.com
    plan: free
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://crypto-investor-api.onrender.com
