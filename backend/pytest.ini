[pytest]
# B-1 (corrida 2026-11-14): silencia SOLO el DeprecationWarning de
# datetime.utcnow() de la dependencia python-jose (jose/jwt.py:281,311,
# _validate_nbf/_validate_exp). Es ruido de una dependencia — ~1000
# warnings por corrida que entierran los warnings propios — no de
# código nuestro. No se suben dependencias en esta corrida; cuando se
# toque python-jose, subirlo a una versión sin utcnow() o migrar el
# encode/decode a PyJWT, y entonces borrar este filtro.
filterwarnings =
    ignore:datetime\.datetime\.utcnow\(\) is deprecated:DeprecationWarning:jose\.jwt
